spring.application.name=college-management

# Use cloud PORT environment variable if available, or default to 8083
server.port=${PORT:8083}

# Datasource configuration (defaults to persistent H2, easily overridable via environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/college_db;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console